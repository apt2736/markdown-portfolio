<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- MathJax 3 Configuration for LaTeX Rendering -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Mermaid.js for Flowcharts and Diagrams -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({
      startOnLoad: false,
      theme: isDark ? 'dark' : 'default',
      securityLevel: 'loose'
    });
    document.addEventListener("DOMContentLoaded", async function() {
      const codeBlocks = document.querySelectorAll('pre.highlight > code.language-mermaid, pre > code.language-mermaid');
      if (codeBlocks.length > 0) {
        for (const el of codeBlocks) {
          const container = document.createElement('div');
          container.className = 'mermaid';
          container.textContent = el.textContent;
          const parent = el.closest('.highlighter-rouge') || el.closest('pre');
          parent.replaceWith(container);
        }
        await mermaid.run();
      }
    });
  </script>

  <!-- Automatic .md -> .html link resolution for GitHub Pages -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      document.querySelectorAll('a').forEach(function(link) {
        var href = link.getAttribute('href');
        if (href && !href.startsWith('http://') && !href.startsWith('https://') && !href.startsWith('#') && !href.startsWith('mailto:')) {
          if (href.endsWith('README.md')) {
            link.setAttribute('href', href.replace(/README\.md$/, 'index.html'));
          } else if (href.endsWith('.md')) {
            link.setAttribute('href', href.replace(/\.md$/, '.html'));
          }
        }
      });
    });
  </script>
</head>
<body>
  <div class="page-wrapper">
    <main class="markdown-body">
      {{ content }}
    </main>
  </div>
</body>
</html>
